<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Inspeksi — Industrial AI</title>
<style>
  :root {
    --bg: #eef1f5;
    --sidebar: #ffffff;
    --panel: #ffffff;
    --panel-2: #f4f6f9;
    --border: #e2e8f0;
    --text: #1a2332;
    --text-dim: #6b7a90;
    --accent: #1a7a5e;
    --accent-light: #e8f5f0;
    --accent-mid: #2a9d7a;
    --danger: #e53e3e;
    --danger-bg: #fff5f5;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --ok: #2f855a;
    --ok-bg: #f0fff4;
    --info: #2b6cb0;
    --info-bg: #ebf8ff;
    --sidebar-w: 280px;
    --header-h: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 100vh;
  }
  .sidebar-brand { padding: 22px 24px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-brand .brand-name { font-size: 16px; font-weight: 700; color: var(--accent); }
  .sidebar-brand .brand-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: .3px; }
  .nav-section { flex: 1; padding: 16px 12px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-dim); text-decoration: none;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); border-left: 3px solid var(--accent); padding-left: 9px; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-footer { border-top: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .btn-new {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-new:hover { background: var(--accent-mid); }
  .profile-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
  .profile-row:hover { background: var(--panel-2); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .profile-info .name { font-size: 13px; font-weight: 600; }
  .profile-info .sub { font-size: 11px; color: var(--text-dim); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .header {
    height: var(--header-h); background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0;
  }
  .header-title { font-size: 15px; font-weight: 700; flex: 1; }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; width: 260px;
  }
  .search-bar input { background: none; border: none; outline: none; font-size: 13px; color: var(--text); width: 100%; }
  .search-bar input::placeholder { color: var(--text-dim); }
  .search-bar svg { color: var(--text-dim); width: 14px; height: 14px; flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); }
  .account-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

  /* CONTENT */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* TOOLBAR */
  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .count-badge { margin-left: auto; font-size: 12px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; }
  .btn-refresh { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-refresh:hover { background: var(--accent-mid); }

  /* TABLE */
  .table-wrap { flex: 1; overflow: auto; padding: 20px 24px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  thead th {
    background: var(--panel-2); color: var(--text-dim);
    font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  .sort-icon { margin-left: 4px; opacity: .5; }
  .sorted .sort-icon { opacity: 1; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  tbody td { padding: 12px 16px; vertical-align: middle; font-size: 13px; }
  .tag { font-weight: 700; color: var(--accent); }
  .narrative-cell { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); font-size: 12px; }

  /* PILLS */
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin: 1px 2px 1px 0; }
  .pill.high, .pill.decreasing { background: var(--danger-bg); color: var(--danger); }
  .pill.warning, .pill.increasing { background: var(--warn-bg); color: var(--warn); }
  .pill.normal { background: var(--ok-bg); color: var(--ok); }
  .pill.low { background: var(--info-bg); color: var(--info); }
  .pill.none { background: var(--panel-2); color: var(--text-dim); }

  /* EXPAND */
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
  .expand-btn:hover { border-color: var(--accent); color: var(--accent); }
  .findings-row td { padding: 0; }
  .findings-inner { padding: 16px 24px; background: #f8fafc; border-top: 1px solid var(--border); }
  .findings-inner table { box-shadow: none; border-radius: 8px; border: 1px solid var(--border); }
  .findings-inner thead th { font-size: 10px; padding: 8px 12px; background: var(--panel-2); }
  .findings-inner tbody td { padding: 8px 12px; font-size: 12px; }

  /* DELETE */
  .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; opacity: .5; font-size: 15px; padding: 3px 7px; border-radius: 6px; }
  .btn-del:hover { opacity: 1; background: var(--danger-bg); }

  /* EMPTY */
  .empty-row td { text-align: center; padding: 60px; color: var(--text-dim); font-size: 14px; }

  /* MODAL */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; align-items: center; justify-content: center; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
  .modal h3 { font-size: 16px; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.5; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btns button { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-cancel { background: var(--panel-2); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-cancel:hover { background: var(--border); }
  .btn-confirm-del { background: var(--danger); color: #fff; }
  .btn-confirm-del:hover { background: #c53030; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">Industrial AI</div>
    <div class="brand-sub">Precision Inspector</div>
  </div>

  <nav class="nav-section">
    <a href="/data" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Equipment List
    </a>
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Inspection History
    </a>
    <a href="/data" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Analytics
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/" class="btn-new" style="text-decoration:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Inspection
    </a>
    <div class="profile-row">
      <div class="avatar">T</div>
      <div class="profile-info">
        <div class="name">Technician Profile</div>
        <div class="sub">Help Center</div>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <header class="header">
    <div class="header-title">Data Inspeksi</div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input placeholder="Search parameters..." />
    </div>
    <div class="icon-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <div class="account-chip">ACCOUNT_</div>
  </header>

  <div class="content">
    <div class="toolbar">
      <input id="searchTag" placeholder="Filter equipment tag..." />
      <select id="filterStatus">
        <option value="">Semua status</option>
        <option value="high">High</option>
        <option value="warning">Warning</option>
        <option value="normal">Normal</option>
        <option value="low">Low</option>
        <option value="decreasing">Decreasing</option>
        <option value="increasing">Increasing</option>
      </select>
      <button class="btn-refresh" onclick="load()">↻ Refresh</button>
      <span class="count-badge" id="countLabel">0 data</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-col="equipment_tag">Equipment Tag <span class="sort-icon">↕</span></th>
            <th data-col="inspection_date">Tanggal <span class="sort-icon">↕</span></th>
            <th data-col="equipment_type">Tipe</th>
            <th data-col="operating_status">Status Operasi</th>
            <th>Findings</th>
            <th>Narasi</th>
            <th>Detail</th>
            <th>Hapus</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="8">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3>Hapus Inspeksi</h3>
    <p id="modalMsg"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-confirm-del" id="btnConfirmDel">Hapus</button>
    </div>
  </div>
</div>

<script>
let allData = [];
let sortCol = 'inspection_date', sortDir = -1;
let pendingDeleteId = null;

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function load() {
  const tag = document.getElementById('searchTag').value.trim();
  const url = tag ? `/api/inspections?equipment_tag=${encodeURIComponent(tag)}&limit=200` : '/api/inspections?limit=200';
  try { const r = await fetch(url); allData = await r.json(); } catch { allData = []; }
  render();
}

function filterData(data) {
  const st = document.getElementById('filterStatus').value;
  return st ? data.filter(d => d.findings.some(f => f.status === st)) : data;
}

function sortData(data) {
  return [...data].sort((a,b) => {
    const va = a[sortCol]??'', vb = b[sortCol]??'';
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });
}

function pillSummary(findings) {
  const c = {};
  findings.forEach(f => { if(f.status) c[f.status]=(c[f.status]||0)+1; });
  if (!Object.keys(c).length) return '<span class="pill none">—</span>';
  return Object.entries(c).map(([s,n])=>`<span class="pill ${s}">${s}${n>1?' ×'+n:''}</span>`).join('');
}

function findingsTable(findings) {
  if (!findings.length) return '<em style="color:var(--text-dim);font-size:12px">Tidak ada findings.</em>';
  const rows = findings.map(f=>`<tr>
    <td>${esc(f.parameter??f.component??'—')}</td>
    <td>${esc(f.finding??'—')}</td>
    <td>${esc(f.location??'—')}</td>
    <td>${f.value!=null?f.value:'—'} ${esc(f.unit??'')}</td>
    <td>${f.previous_value!=null?f.previous_value:'—'}</td>
    <td>${f.normal_value!=null?f.normal_value:'—'}</td>
    <td><span class="pill ${f.status??'none'}">${esc(f.status??'—')}</span></td>
  </tr>`).join('');
  return `<table><thead><tr><th>Parameter/Komponen</th><th>Finding</th><th>Lokasi</th><th>Nilai</th><th>Prev</th><th>Normal</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function render() {
  const data = sortData(filterData(allData));
  document.getElementById('countLabel').textContent = `${data.length} data`;

  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
    const ic = th.querySelector('.sort-icon');
    if (ic) ic.textContent = th.dataset.col===sortCol ? (sortDir===1?'↑':'↓') : '↕';
  });

  const tbody = document.getElementById('tableBody');
  if (!data.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Belum ada data inspeksi.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  data.forEach(item => {
    const tr = document.createElement('tr');
    tr.id = 'row-' + item.id;
    tr.innerHTML = `
      <td><span class="tag">${esc(item.equipment_tag)}</span></td>
      <td>${item.inspection_date}</td>
      <td>${esc(item.equipment_type??'—')}</td>
      <td>${esc(item.operating_status??'—')}</td>
      <td>${pillSummary(item.findings)}</td>
      <td><div class="narrative-cell" title="${esc(item.raw_narrative)}">${esc(item.raw_narrative)}</div></td>
      <td><button class="expand-btn" onclick="toggleDetail(${item.id})">Detail</button></td>
      <td><button class="btn-del" onclick="askDelete(${item.id},'${esc(item.equipment_tag)}')" title="Hapus">✕</button></td>
    `;
    tbody.appendChild(tr);

    const fr = document.createElement('tr');
    fr.className = 'findings-row';
    fr.id = 'findings-' + item.id;
    fr.style.display = 'none';
    fr.innerHTML = `<td colspan="8"><div class="findings-inner">${findingsTable(item.findings)}</div></td>`;
    tbody.appendChild(fr);
  });
}

function toggleDetail(id) {
  const row = document.getElementById('findings-' + id);
  const btn = document.querySelector(`#row-${id} .expand-btn`);
  const open = row.style.display !== 'none';
  document.querySelectorAll('.findings-row').forEach(r => r.style.display='none');
  document.querySelectorAll('.expand-btn').forEach(b => b.textContent='Detail');
  if (!open) { row.style.display=''; btn.textContent='Tutup'; }
}

function askDelete(id, tag) {
  pendingDeleteId = id;
  document.getElementById('modalMsg').textContent = `Hapus inspeksi "${tag}" (ID ${id})? Tindakan ini tidak dapat dibatalkan.`;
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('btnConfirmDel').onclick = confirmDelete;
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('show'); pendingDeleteId=null; }
async function confirmDelete() {
  if (!pendingDeleteId) return;
  closeModal();
  try { await fetch(`/api/inspections/${pendingDeleteId}`,{method:'DELETE'}); await load(); }
  catch(e) { alert('Gagal menghapus: '+e.message); }
}

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol===th.dataset.col) sortDir*=-1; else { sortCol=th.dataset.col; sortDir=-1; }
    render();
  });
});

document.getElementById('searchTag').addEventListener('input', () => { clearTimeout(window._t); window._t=setTimeout(load,300); });
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

load();
</script>
</body>
</html>
